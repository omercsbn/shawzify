# Keep dependencies current without turning the repository into a pull-request
# firehose: grouped updates, monthly, and only what actually needs watching.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      frontend:
        patterns: ['*']
        update-types: [minor, patch]
      frontend-major:
        patterns: ['*']
        update-types: [major]
    commit-message:
      prefix: 'deps'

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    groups:
      site:
        patterns: ['*']
    commit-message:
      prefix: 'deps'

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: monthly
    groups:
      rust:
        patterns: ['*']
        update-types: [minor, patch]
      rust-major:
        patterns: ['*']
        update-types: [major]
    commit-message:
      prefix: 'deps'

  - package-ecosystem: pip
    directory: /engine
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ['*']
        update-types: [minor, patch]
      python-major:
        patterns: ['*']
        update-types: [major]
    commit-message:
      prefix: 'deps'
