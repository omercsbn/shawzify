name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
      # The demo is the app itself, so a change to the interface changes the
      # published site. Leaving this out meant a fix could sit on main while
      # the demo kept serving the bug.
      - 'apps/desktop/src/**'
      - 'apps/desktop/package-lock.json'
      - 'scripts/build_demo_fixture.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            apps/desktop/package-lock.json

      - name: Install the app's dependencies
        # The site build compiles the app itself for the demo, so this job
        # needs the frontend's packages as well as the site's.
        working-directory: apps/desktop
        run: npm ci

      - name: Build the site and the demo
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
