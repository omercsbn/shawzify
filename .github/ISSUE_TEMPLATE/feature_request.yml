name: Feature request
description: Suggest something SHAWZIFY should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Some things are permanently out of scope — anything that touches the
        game process (injection, memory access, hooking, anti-cheat), sending
        audio to a remote service, or bundling game assets. Everything else is
        open.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the solution. What are you actually trying to get out of SHAWZIFY?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: How you imagine it working. A rough sketch is fine.

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: Including "nothing, I gave up" — that is useful to know.
