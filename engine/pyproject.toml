[project]
name = "shawzify-engine"
version = "0.1.0"
description = "SHAWZIFY audio/MIDI to Warframe Shawzin arrangement engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "mido>=1.3",
    "soundfile>=0.12",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
audio = ["librosa>=0.10"]
ml = ["torch>=2.0", "torchaudio>=2.0", "demucs>=4.0", "basic-pitch>=0.4"]
dev = ["pytest>=7", "pytest-cov", "hypothesis>=6", "ruff", "mypy"]

[project.scripts]
shawzify = "shawzify_engine.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shawzify_engine*"]

[tool.setuptools.package-data]
"shawzify_engine.shawzin" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B905", "E501"]
